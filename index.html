<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>模擬盤｜未下真錢｜手機版</title>
<style>
:root{
  --bg:#0c1016; --panel:#161f2b; --text:#f2f5f9; --muted:#8b9aab;
  --banker:#e74c4c; --player:#3b8beb; --tie:#2ecc71; --warn:#f0c14b;
  --win:#3ddc84; --lose:#ff5c5c;
  --cell:28px; --gap:2px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}
.wrap{height:100%;width:100%;overflow:hidden;display:flex;flex-direction:column;padding:6px 8px;gap:5px}
.banner{flex:0 0 auto;background:#5a1515;color:#ffd0d0;text-align:center;font-size:18px;font-weight:800;
  padding:5px 8px;border:2px solid #ff6b6b;letter-spacing:.05em}
.row{display:flex;gap:6px;min-width:0;width:100%}
.row.top{flex:0 0 auto;flex-wrap:wrap;align-items:stretch}
.panel{background:var(--panel);border-radius:8px;padding:6px 8px;min-width:0}
.bal{font-size:32px;font-weight:800;line-height:1.1}
.fake{color:var(--warn);font-size:12px}
.big-line{font-size:26px;font-weight:800;line-height:1.2;margin:2px 0}
.big-line .amt{font-size:28px}
.win{color:var(--win)} .lose{color:var(--lose)} .neu{color:var(--warn)}
.muted{color:var(--muted);font-size:11px}
label{font-size:11px;color:var(--muted);display:block}
input[type=number],select{font-size:16px;padding:4px 6px;border-radius:6px;border:none;background:#0b1018;color:var(--text)}
.btns{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
button{font-size:14px;font-weight:700;padding:7px 11px;border:none;border-radius:7px;cursor:pointer;color:#fff}
.b-B{background:var(--banker)} .b-P{background:var(--player)} .b-T{background:#2a7a52}
.b-deal{background:#6b5cff} .b-fast{background:#c47a00} .b-new{background:#555}
.b-auto{background:#0a7a5a} .b-stop{background:#8a3030} .b-reset{background:#444}
.hands{display:flex;gap:6px}
.hand{background:#0b1018;border-radius:6px;padding:4px 8px;min-width:90px;text-align:center}
.hand .who{font-size:11px;color:var(--muted)} .hand .pts{font-size:22px;font-weight:800;line-height:1}
.hand .cards{font-size:11px;color:var(--muted)}
.motto-box{flex:1;min-width:200px;background:#1c2a18;border:2px solid #3ecf8e;border-radius:8px;padding:6px 8px}
.motto-box .title{font-size:11px;color:var(--muted)}
.motto-box .now{font-size:20px;font-weight:800;color:#7dffa8}
.motto-box .sug{font-size:14px;font-weight:700}
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 8px;font-size:13px}
.stats-grid b{font-size:18px}
.mid{flex:0 0 auto;display:flex;gap:6px;min-height:0}
.auto-panel{flex:1.1;min-width:0}
.chart-panel{flex:0.9;min-width:0;display:flex;flex-direction:column}
#balChart{width:100%;height:110px;background:#0b1018;border-radius:6px}
.roads{flex:1 1 auto;min-height:0;min-width:0;width:100%;display:flex;flex-direction:column;gap:4px}
.road-panel{background:var(--panel);border-radius:8px;padding:4px 6px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.road-panel h3{margin:0 0 2px;font-size:11px;font-weight:700;color:var(--muted)}
.road-panel.big{flex:1.1 1 0;min-height:120px}
.derived-row{flex:0.75 1 0;min-height:100px;min-width:0;width:100%;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:4px}
.scroller{flex:1;min-width:0;overflow:auto;background:#0b1018;border-radius:6px;padding:3px;position:relative;-webkit-overflow-scrolling:touch}
.grid-wrap{position:relative;width:max-content;min-height:100%;padding-top:2px}
.grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(6,var(--cell));
  grid-auto-columns:var(--cell);gap:var(--gap);width:max-content}
.cell{width:var(--cell);height:var(--cell);position:relative}
.bead{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;font-size:9px;font-weight:800}
.bead.B{border:2px solid var(--banker);color:var(--banker)}
.bead.B.fill{background:var(--banker);color:#fff;border-color:var(--banker)}
.bead.P{border:2px solid var(--player);color:var(--player)}
.bead.P.fill{background:var(--player);color:#fff;border-color:var(--player)}
.bead.hollow{background:transparent}
.bead.dot{border:none;border-radius:50%;width:55%;height:55%;margin:22.5%}
.bead.slash{border:none;border-radius:0;background:transparent}
.bead.slash::after{content:"";position:absolute;left:18%;right:18%;top:50%;height:2px;background:currentColor;transform:rotate(-45deg)}
.tie-mark{position:absolute;inset:0;pointer-events:none}
.tie-mark::before{content:"";position:absolute;left:12%;right:12%;top:50%;height:2px;background:var(--tie);transform:rotate(-35deg)}
.tie-count{position:absolute;right:-2px;top:-3px;background:#0b1018;color:var(--tie);font-size:8px;font-weight:800;padding:0 2px;border-radius:2px}
.pattern-layer{position:absolute;inset:0;pointer-events:none;z-index:5}
.pattern-rect{position:absolute;border:2px solid #f0c14b;border-radius:6px;box-sizing:border-box}
.pattern-rect.dim{border-color:#9a7b28;opacity:.55}
.pattern-rect.hot{border-color:#ffe566;box-shadow:0 0 0 1px rgba(255,229,102,.45);opacity:1}
.pattern-tag{position:absolute;background:#f0c14b;color:#111;font-size:11px;font-weight:800;padding:1px 5px;border-radius:3px;white-space:nowrap;z-index:6;pointer-events:none}
.pattern-tag.dim{background:#8a7020;color:#f5e6b8;opacity:.9}
.pattern-tag.hot{background:#f0c14b;color:#111}
/* Result popups */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:100;background:rgba(0,0,0,.35);pointer-events:none}
.overlay.show{display:flex}
.overlay.block{pointer-events:auto;background:rgba(0,0,0,.55)}
.popup{background:#121a24;border:3px solid #f0c14b;border-radius:16px;padding:22px 36px;text-align:center;min-width:280px;max-width:90vw;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.popup .main{font-size:56px;font-weight:900;line-height:1.1;letter-spacing:.04em}
.popup .pnl{font-size:42px;font-weight:800;margin-top:8px}
.popup .sub{font-size:16px;color:var(--muted);margin-top:6px}
.popup .theo{font-size:14px;color:var(--warn);margin-top:8px}
.popup.final .main{font-size:40px}
@media (max-width:1400px){
  :root{--cell:24px}
  .bal{font-size:28px}
  .big-line{font-size:22px}
  .popup .main{font-size:48px}
  .popup .pnl{font-size:36px}
  #balChart{height:90px}
}
/* ===== Mobile portrait (phone) ===== */
@media (max-width:480px){
  :root{--cell:22px; --gap:2px}
  html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto;-webkit-text-size-adjust:100%}
  .wrap{height:auto;min-height:100dvh;overflow:visible;overflow-x:hidden;padding:0 0 24px;gap:0;
    display:flex;flex-direction:column}
  .banner{position:sticky;top:0;z-index:50;font-size:13px;line-height:1.35;padding:8px 6px;
    letter-spacing:.02em;border-left:none;border-right:none;border-radius:0}
  /* Reorder: play → roads → meta */
  .sec-play{order:1}
  .roads{order:2}
  .sec-meta{order:3}
  .sec-play,.sec-meta,.roads{width:100%;padding:6px 8px;gap:6px}
  .row.top{flex-direction:column;flex-wrap:nowrap}
  .panel{width:100%}
  .motto-box{min-width:0;width:100%}
  .bal{font-size:28px}
  .big-line{font-size:20px}
  .big-line .amt{font-size:22px}
  .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;font-size:13px}
  .stats-grid b{font-size:20px}
  button{min-height:44px;padding:10px 12px;font-size:15px;border-radius:8px;flex:1 1 auto}
  .btns button{min-width:calc(50% - 4px)}
  .btns .b-deal{min-width:100%}
  input[type=number],select{min-height:44px;font-size:16px;padding:8px 10px;width:100%;max-width:100%}
  .auto-panel .btns{flex-direction:column;align-items:stretch}
  .auto-panel .btns label{width:100%}
  .auto-panel .btns label input,
  .auto-panel .btns label select{width:100%;margin-top:2px}
  .auto-panel .btns > button{width:100%;min-width:0}
  /* Roads: fixed heights, horizontal scroll inside, no page overflow */
  .roads{flex:none;min-height:0;overflow:hidden}
  .road-panel.big{flex:none;height:200px;min-height:200px}
  .derived-row{flex:none;min-height:0;height:auto;
    grid-template-columns:1fr;gap:6px}
  .derived-row .road-panel{height:120px;min-height:120px}
  .scroller{overflow-x:auto;overflow-y:hidden;touch-action:pan-x}
  #balChart{height:140px}
  .chart-panel{width:100%}
  .popup{padding:18px 16px;min-width:0;width:92vw;border-radius:14px}
  .popup .main{font-size:40px}
  .popup .pnl{font-size:28px}
  .popup.final .main{font-size:28px}
  .popup .theo{font-size:12px;word-break:break-word}
  .hand{min-width:0;flex:1}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">模擬盤，未下真錢｜假金額｜非任何平台</div>

  <div class="row top sec-play">
    <div class="panel" style="min-width:210px">
      <label>假餘額（模擬幣）</label>
      <div class="bal" id="bal">10,000</div>
      <div class="fake">※ 假金額，不是真錢</div>
      <label style="margin-top:4px">下注金額</label>
      <input type="number" id="amt" value="100" min="1" step="1" style="width:100px"/>
      <div class="btns">
        <button class="b-B" type="button" onclick="pick('B')">押莊</button>
        <button class="b-P" type="button" onclick="pick('P')">押閒</button>
        <button class="b-T" type="button" onclick="pick('T')">押和</button>
        <button class="b-deal" type="button" onclick="dealBet()">開牌</button>
      </div>
      <div class="btns">
        <button class="b-fast" type="button" onclick="fastPave(10)">快速鋪路 ×10</button>
        <button class="b-new" type="button" onclick="newShoe(false)">新鞋／清路</button>
      </div>
    </div>

    <div class="panel" style="min-width:240px;flex:1">
      <div class="big-line" id="handLabel">本手押：—</div>
      <div class="big-line" id="resLine">開出：—</div>
      <div class="big-line" id="pnlLine">本手：—</div>
      <div class="hands" style="margin-top:4px">
        <div class="hand"><div class="who">閒</div><div class="pts" id="pPts">—</div><div class="cards" id="pCards"></div></div>
        <div class="hand"><div class="who">莊</div><div class="pts" id="bPts">—</div><div class="cards" id="bCards"></div></div>
      </div>
      <div class="muted" id="deltaDetail"></div>
    </div>

    <div class="motto-box">
      <div class="title">目前觸發的口訣</div>
      <div class="now" id="mottoNow">無</div>
      <div class="sug" id="mottoSug"></div>
    </div>
  </div>

  <div class="row top sec-meta">
    <div class="panel" style="flex:1.2">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b style="font-size:14px">紀錄</b>
        <button class="b-reset" type="button" onclick="resetStats()">重設紀錄</button>
      </div>
      <div class="stats-grid" style="margin-top:4px">
        <div>總手數<br><b id="stHands">0</b></div>
        <div>實際下注<br><b id="stBets">0</b></div>
        <div>總下注額<br><b id="stWagered">0</b></div>
        <div>累計輸贏<br><b id="stPnl">0</b></div>
        <div>贏<br><b id="stWin" class="win">0</b></div>
        <div>輸<br><b id="stLose" class="lose">0</b></div>
        <div>和（下注）<br><b id="stTie">0</b></div>
        <div class="muted">贏+輸+和＝下注手</div>
      </div>
    </div>
    <div class="panel auto-panel">
      <b style="font-size:14px">自動投注</b>
      <div class="btns" style="align-items:center">
        <label style="margin:0">口訣
          <select id="autoMotto">
            <option value="follow_dragon">跟龍</option>
            <option value="chop_dragon">斬龍</option>
            <option value="follow_chop">跟單跳</option>
            <option value="chop_chop">斬單跳</option>
            <option value="follow_double">跟雙跳</option>
            <option value="always_banker" selected>永遠押莊</option>
          </select>
        </label>
        <label style="margin:0">每手
          <input type="number" id="autoAmt" value="100" min="1" style="width:80px"/>
        </label>
        <label style="margin:0">開牌手數
          <input type="number" id="autoN" value="10000" min="1" max="100000" style="width:90px"/>
        </label>
        <button class="b-auto" type="button" id="btnAuto" onclick="toggleAuto()">開始</button>
        <button class="b-stop" type="button" onclick="stopAuto(true)">停止</button>
      </div>
      <div class="btns" style="margin-top:2px">
        <span class="muted" style="align-self:center">快速選</span>
        <button class="b-new" type="button" onclick="setAutoN(1000)">1,000</button>
        <button class="b-new" type="button" onclick="setAutoN(10000)">10,000</button>
        <button class="b-fast" type="button" onclick="setAutoN(100000)">100,000</button>
      </div>
      <div class="muted" id="autoStatus">開牌 0／0｜實際下注 0｜模擬幣</div>
    </div>
    <div class="panel chart-panel">
      <b style="font-size:13px">餘額曲線</b>
      <canvas id="balChart" width="640" height="110"></canvas>
      <div class="muted" id="theoLine">理論平均：—</div>
    </div>
  </div>

  <div class="roads">
    <div class="road-panel big">
      <h3>大路（紅＝莊｜藍＝閒｜綠斜線＝和）</h3>
      <div class="scroller" id="scBig"><div class="grid-wrap" id="wrapBig"><div class="grid" id="gridBig"></div><div class="pattern-layer" id="patBig"></div></div></div>
    </div>
    <div class="derived-row">
      <div class="road-panel"><h3>大眼仔</h3><div class="scroller" id="scEye"><div class="grid-wrap"><div class="grid" id="gridEye"></div></div></div></div>
      <div class="road-panel"><h3>小路</h3><div class="scroller" id="scSmall"><div class="grid-wrap"><div class="grid" id="gridSmall"></div></div></div></div>
      <div class="road-panel"><h3>曱甴路</h3><div class="scroller" id="scCock"><div class="grid-wrap"><div class="grid" id="gridCock"></div></div></div></div>
    </div>
  </div>
</div>

<div class="overlay" id="handOverlay"><div class="popup" id="handPopup">
  <div class="main" id="handMain">—</div>
  <div class="pnl" id="handPnl">—</div>
  <div class="sub">模擬幣</div>
</div></div>

<div class="overlay block" id="finalOverlay" onclick="closeFinal()"><div class="popup final" id="finalPopup" onclick="event.stopPropagation()">
  <div class="main" id="finalMain">—</div>
  <div class="sub" id="finalSub">—</div>
  <div class="theo" id="finalTheo">—</div>
  <div class="theo" id="finalRates">—</div>
  <div class="theo" id="finalGap">—</div>
  <div class="sub" style="margin-top:12px">點一下關閉</div>
</div></div>

<script>
const DECKS=8, MAX_ROW=6;
const HE_B=0.0106, HE_P=0.0124; // WoO 八副牌

let shoe=[], balance=10000, choice=null, nHands=0;
let leadingTies=0, columns=[], historyNonTie=[];
let suppressPopup=false;
let auto={running:false, stop:false, motto:'always_banker', amt:100, target:1000, done:0, betOnB:0, betOnP:0};
let stats={hands:0, bets:0, wagered:0, win:0, lose:0, tieBet:0, pnl:0};
let balHistory=[10000];
let theoHistory=[10000]; // theoretical balance path (start − expected loss)
let handPopupTimer=null;
function setAutoN(n){ document.getElementById('autoN').value=n; }

function fmt(n){ return Number(n).toLocaleString('en-US'); }
function sideName(s){ return s==='B'?'莊':(s==='P'?'閒':'和'); }
function cardLabel(v){ return v===0?'10':(v===1?'A':String(v)); }

function makeShoe(){
  const one=[1,2,3,4,5,6,7,8,9,0,0,0,0];
  shoe=[];
  for(let d=0;d<DECKS;d++) for(let s=0;s<4;s++) shoe.push(...one);
  for(let i=shoe.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [shoe[i],shoe[j]]=[shoe[j],shoe[i]];
  }
}
makeShoe();

function drawCard(){ if(shoe.length<6) makeShoe(); return shoe.pop(); }
function tot(c){ return c.reduce((a,b)=>a+b,0)%10; }
function bankerDraws(bt,p3){
  if(p3===null) return bt<=5;
  if(bt<=2) return true;
  if(bt===3) return p3!==8;
  if(bt===4) return [2,3,4,5,6,7].includes(p3);
  if(bt===5) return [4,5,6,7].includes(p3);
  if(bt===6) return [6,7].includes(p3);
  return false;
}
function playHand(){
  const p=[drawCard(),drawCard()], b=[drawCard(),drawCard()];
  let pt=tot(p), bt=tot(b), p3=null;
  if(pt<8 && bt<8){
    if(pt<=5){ p3=drawCard(); p.push(p3); pt=tot(p); }
    if(bankerDraws(bt,p3)){ b.push(drawCard()); bt=tot(b); }
  }
  const outcome = pt>bt?'P':(bt>pt?'B':'T');
  return {p,b,pt,bt,outcome};
}

function appendRoad(outcome){
  if(outcome==='T'){
    if(columns.length===0) leadingTies++;
    else columns[columns.length-1][columns[columns.length-1].length-1].ties++;
    return;
  }
  historyNonTie.push(outcome);
  if(columns.length===0){
    columns.push([{side:outcome,ties:0}]);
    if(leadingTies>0){ columns[0][0].ties=leadingTies; leadingTies=0; }
    return;
  }
  const last=columns[columns.length-1];
  if(outcome===last[0].side) last.push({side:outcome,ties:0});
  else columns.push([{side:outcome,ties:0}]);
}
function countBeads(){ let n=0; for(const c of columns) n+=c.length; return n; }

function placeBeads(logicalCols){
  const occupied=new Map(), placed=[];
  const key=(x,y)=>x+','+y, taken=(x,y)=>occupied.has(key(x,y));
  for(let ci=0;ci<logicalCols.length;ci++){
    const col=logicalCols[ci];
    let x=ci; while(taken(x,0)) x++;
    let y=0;
    for(let ri=0;ri<col.length;ri++){
      if(ri===0){ y=0; while(taken(x,y)) x++; }
      else {
        if(y+1<MAX_ROW && !taken(x,y+1)) y=y+1;
        else { x=x+1; while(taken(x,y)) x++; }
      }
      occupied.set(key(x,y),true);
      placed.push({x,y,bead:col[ri],logicalCol:ci,logicalRow:ri});
    }
  }
  return placed;
}

function buildDerivedColumns(probe){
  const sequence=[];
  for(let ci=0;ci<columns.length;ci++){
    for(let ri=0;ri<columns[ci].length;ri++){
      const started=(ci===probe&&ri>=1)||(ci>=probe+1);
      if(!started) continue;
      let color;
      if(ri===0){
        const a=columns[ci-probe], b=columns[ci-probe-1];
        if(!a||!b) continue;
        color=(a.length===b.length)?'R':'B';
      } else {
        const prev=columns[ci-probe];
        if(!prev) continue;
        color=(prev.length>ri)?'R':'B';
      }
      sequence.push(color);
    }
  }
  const cols=[];
  for(const c of sequence){
    if(!cols.length||cols[cols.length-1][0].side!==c) cols.push([{side:c}]);
    else cols[cols.length-1].push({side:c});
  }
  return cols;
}

function findAllPatterns(){
  const all=[];
  for(let ci=0;ci<columns.length;ci++){
    const len=columns[ci].length;
    if(len<5) continue;
    const side=columns[ci][0].side;
    const cells=[]; for(let ri=0;ri<len;ri++) cells.push({ci,ri});
    all.push({name:'長龍',label:'長龍 '+len,active:ci===columns.length-1,col:ci,streak:len,side,cells,
      follow:{text:'跟龍：建議押'+(side==='B'?'莊':'閒'),side},
      chop:{text:'斬龍：建議押'+(side==='B'?'閒':'莊'),side:side==='B'?'P':'B'}});
  }
  { let ci=0;
    while(ci<columns.length){
      if(columns[ci].length!==1){ci++;continue;}
      const start=ci; while(ci<columns.length&&columns[ci].length===1) ci++;
      const run=ci-start;
      if(run>=4){
        const cells=[]; for(let k=start;k<ci;k++) cells.push({ci:k,ri:0});
        const last=columns[ci-1][0].side, followSide=last==='B'?'P':'B';
        all.push({name:'單跳',label:'單跳',active:ci===columns.length,startCol:start,endCol:ci-1,run,cells,
          follow:{text:'跟單跳：建議押'+(followSide==='B'?'莊':'閒'),side:followSide},
          chop:{text:'斬單跳：建議押'+(last==='B'?'莊':'閒'),side:last}});
      }
    }
  }
  { let ci=0;
    while(ci<columns.length){
      if(columns[ci].length!==2){ci++;continue;}
      const start=ci; let pairs=1; ci++;
      while(ci<columns.length&&columns[ci].length===2&&columns[ci][0].side!==columns[ci-1][0].side){pairs++;ci++;}
      if(pairs>=3){
        const cells=[];
        for(let k=start;k<start+pairs;k++){ cells.push({ci:k,ri:0}); cells.push({ci:k,ri:1}); }
        const last=columns[start+pairs-1][0].side, followSide=last==='B'?'P':'B';
        all.push({name:'雙跳',label:'雙跳',active:(start+pairs)===columns.length,startCol:start,endCol:start+pairs-1,pairs,cells,
          follow:{text:'跟雙跳：建議押'+(followSide==='B'?'莊':'閒'),side:followSide},chop:null});
      } else ci=start+1;
    }
  }
  return all;
}
function detectPatterns(){ return findAllPatterns().filter(p=>p.active); }

/** Auto motto → bet side or null */
function autoPredict(motto){
  const all=findAllPatterns();
  const cur=all.filter(p=>p.active);
  if(motto==='always_banker') return 'B';
  if(motto==='follow_dragon'){ const d=cur.find(p=>p.name==='長龍'); return d?d.side:null; }
  if(motto==='chop_dragon'){ const d=cur.find(p=>p.name==='長龍'); return d?(d.side==='B'?'P':'B'):null; }
  if(motto==='follow_chop'){ const d=cur.find(p=>p.name==='單跳'); return d?d.follow.side:null; }
  if(motto==='chop_chop'){ const d=cur.find(p=>p.name==='單跳'); return d?d.chop.side:null; }
  if(motto==='follow_double'){ const d=cur.find(p=>p.name==='雙跳'); return d?d.follow.side:null; }
  return null;
}

function settle(choiceSide, outcome, amt){
  // returns {d, kind:'win'|'lose'|'tiePush'|'tieLose'|'tieWin'}
  if(choiceSide==='T'){
    if(outcome==='T') return {d:amt*8, kind:'tieWin'};
    return {d:-amt, kind:'lose'};
  }
  if(outcome==='T') return {d:0, kind:'tiePush'};
  if(choiceSide===outcome){
    const d = choiceSide==='B' ? Math.floor(amt*0.95) : amt;
    return {d, kind:'win'};
  }
  return {d:-amt, kind:'lose'};
}

function applyBet(h, betSide, amt, paved){
  stats.hands++;
  let settled=null;
  if(!paved && betSide){
    settled=settle(betSide, h.outcome, amt);
    balance+=settled.d;
    stats.bets++;
    stats.wagered+=amt;
    stats.pnl+=settled.d;
    if(settled.kind==='win' || settled.kind==='tieWin') stats.win++;
    else if(settled.kind==='lose') stats.lose++;
    else if(settled.kind==='tiePush') stats.tieBet++;
    if(betSide==='B') auto.betOnB+=amt;
    if(betSide==='P') auto.betOnP+=amt;
  }
  if(!arguments[4]){ // recordHist default true; 5th arg false = skip (auto samples)
    balHistory.push(balance);
    const start = balHistory.length ? balHistory[0] : balance;
    theoHistory.push(start - theoExpected());
  }
  appendRoad(h.outcome);
  nHands++;
  updateStatsUI();
  return settled;
}

/* ----- render roads (throttled OK) ----- */
function cellPx(){
  const cs=getComputedStyle(document.documentElement);
  return {cell:parseFloat(cs.getPropertyValue('--cell')), gap:parseFloat(cs.getPropertyValue('--gap'))};
}
function coverRects(cells){
  if(!cells.length) return [];
  const set=new Set(cells.map(c=>c.x+','+c.y)), used=new Set(), rects=[];
  const sorted=[...cells].sort((a,b)=>a.x-b.x||a.y-b.y);
  for(const c of sorted){
    const k0=c.x+','+c.y; if(used.has(k0)) continue;
    let width=1; while(set.has((c.x+width)+','+c.y)&&!used.has((c.x+width)+','+c.y)) width++;
    let height=1;
    grow: while(true){
      for(let dx=0;dx<width;dx++){
        const k=(c.x+dx)+','+(c.y+height);
        if(!set.has(k)||used.has(k)) break grow;
      }
      height++;
    }
    for(let dx=0;dx<width;dx++) for(let dy=0;dy<height;dy++) used.add((c.x+dx)+','+(c.y+dy));
    rects.push({x:c.x,y:c.y,w:width,h:height});
  }
  return rects;
}
function renderBeadEl(bead, kind){
  const div=document.createElement('div'); div.className='cell';
  const b=document.createElement('div');
  if(kind==='big'){
    b.className='bead hollow '+bead.side;
    if(bead.ties>0){
      const tm=document.createElement('div'); tm.className='tie-mark';
      const tc=document.createElement('span'); tc.className='tie-count'; tc.textContent=String(bead.ties);
      tm.appendChild(tc); b.appendChild(tm);
    }
  } else {
    const css=bead.side==='R'?'B':'P';
    if(kind==='eye') b.className='bead hollow '+css;
    else if(kind==='small'){ b.className='bead fill dot '+css; b.style.border='none'; }
    else { b.className='bead slash '+css; b.style.color=css==='B'?'var(--banker)':'var(--player)'; }
  }
  div.appendChild(b); return div;
}
function renderGrid(gridEl, scrollEl, logicalCols, kind){
  gridEl.innerHTML='';
  const placed=placeBeads(logicalCols);
  let maxX=0; for(const p of placed) maxX=Math.max(maxX,p.x);
  const cols=Math.max(maxX+2,10);
  const map=new Map(); for(const p of placed) map.set(p.x+','+p.y,p);
  for(let x=0;x<cols;x++) for(let y=0;y<MAX_ROW;y++){
    const p=map.get(x+','+y);
    if(p) gridEl.appendChild(renderBeadEl(p.bead,kind));
    else { const e=document.createElement('div'); e.className='cell'; gridEl.appendChild(e); }
  }
  requestAnimationFrame(()=>{ scrollEl.scrollLeft=scrollEl.scrollWidth; });
  return placed;
}
function drawPatternOverlays(placed, allPatterns){
  const layer=document.getElementById('patBig'); if(!layer) return;
  layer.innerHTML='';
  const {cell,gap}=cellPx(), step=cell+gap;
  const vis=new Map(); for(const p of placed) vis.set(p.logicalCol+','+p.logicalRow,{x:p.x,y:p.y});
  const ordered=[...allPatterns].sort((a,b)=>(a.active===b.active)?0:(a.active?1:-1));
  const tagSlots=[];
  for(const g of ordered){
    const cells=[]; for(const c of g.cells){ const v=vis.get(c.ci+','+c.ri); if(v) cells.push(v); }
    if(!cells.length) continue;
    let rects;
    if(g.name==='長龍') rects=coverRects(cells);
    else {
      const xs=cells.map(c=>c.x), ys=cells.map(c=>c.y);
      rects=[{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs)+1,h:Math.max(...ys)-Math.min(...ys)+1}];
    }
    const cls=g.active?'hot':'dim';
    const topRect=[...rects].sort((a,b)=>a.y-b.y||a.x-b.x)[0];
    for(const r of rects){
      const el=document.createElement('div'); el.className='pattern-rect '+cls;
      el.style.left=(r.x*step)+'px'; el.style.top=(r.y*step)+'px';
      el.style.width=(r.w*cell+(r.w-1)*gap)+'px'; el.style.height=(r.h*cell+(r.h-1)*gap)+'px';
      layer.appendChild(el);
    }
    if(topRect){
      let tagLeft=topRect.x*step+3, tagTop=topRect.y*step+3;
      const tagH=16, tagW=Math.max(40,g.label.length*12);
      for(let g2=0;g2<8;g2++){
        let hit=false; const box={left:tagLeft,top:tagTop,right:tagLeft+tagW,bottom:tagTop+tagH};
        for(const s of tagSlots){ if(!(box.right<s.left||box.left>s.right||box.bottom<s.top||box.top>s.bottom)){hit=true;break;} }
        if(!hit) break; tagTop+=14;
      }
      tagSlots.push({left:tagLeft,top:tagTop,right:tagLeft+tagW,bottom:tagTop+tagH});
      const tag=document.createElement('div'); tag.className='pattern-tag '+cls; tag.textContent=g.label;
      tag.style.left=tagLeft+'px'; tag.style.top=tagTop+'px'; layer.appendChild(tag);
    }
  }
}

  updateMottoUI(all.filter(p=>p.active));

function drawChart(){
  const c=document.getElementById('balChart');
  const ctx=c.getContext('2d');
  const W=c.width, H=c.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0b1018'; ctx.fillRect(0,0,W,H);
  if(balHistory.length<2) return;
  const series=balHistory.concat(theoHistory||[]);
  let min=series[0], max=series[0];
  for(const v of series){ if(v<min) min=v; if(v>max) max=v; }
  const pad=6, span=Math.max(1,max-min);
  const plot=(arr, color, width, dash)=>{
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.setLineDash(dash||[]);
    ctx.beginPath();
    const n=arr.length;
    for(let i=0;i<n;i++){
      const x=pad+(W-2*pad)*(i/Math.max(1,n-1));
      const y=H-pad-(H-2*pad)*((arr[i]-min)/span);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke(); ctx.setLineDash([]);
  };
  plot(balHistory, '#3ecf8e', 2, []);
  // 理論平均虛線（取代舊的起始餘額虛線）
  if(theoHistory && theoHistory.length>=2){
    plot(theoHistory, '#f0c14b', 1.5, [5,4]);
  }
}

function theoExpected(){
  // based on amounts bet on B/P this session (auto tracking)
  return auto.betOnB*HE_B + auto.betOnP*HE_P;
}

/* ----- Auto bet ----- */
function stopAuto(user){

  if(user) document.getElementById('autoStatus').textContent+='｜已停止';

function toggleAuto(){

async function startAuto(){
  if(auto.running) return;
  auto.running=true; auto.stop=false;
  auto.motto=document.getElementById('autoMotto').value;
  auto.amt=Math.max(1,Math.floor(Number(document.getElementById('autoAmt').value)||100));
  auto.target=Math.max(1,Math.min(100000, Math.floor(Number(document.getElementById('autoN').value)||1000)));
  auto.done=0;
  resetStats();
  // 假餘額：大樣本時提高起始額，避免「破產」提前停押（仍是模擬幣）
  const startBal = Math.max(10000, auto.amt * auto.target);
  balance=startBal; document.getElementById('bal').textContent=fmt(balance);
  balHistory=[balance]; theoHistory=[balance];
  auto._startBal=startBal;
  newShoe(true);
  document.getElementById('btnAuto').textContent='暫停';
  suppressPopup=true;
  const t0=performance.now();
  // 1,000 手維持約 28 秒拍攝節奏；1 萬／10 萬手分批快跑，目標約 20–30 秒
  let targetMs, batch, sampleEvery, renderEvery;
  const narrow = window.matchMedia && window.matchMedia('(max-width:480px)').matches;
  if(auto.target<=1000){
    targetMs=auto.target*28; batch=20; sampleEvery=1; renderEvery=40;
  } else if(auto.target<=10000){
    targetMs=window.__BAC_FAST__?0:22000; batch=narrow?150:400; sampleEvery=Math.ceil(auto.target/1000); renderEvery=narrow?300:800;
  } else {
    targetMs=window.__BAC_FAST__?0:25000; batch=narrow?800:2500; sampleEvery=Math.ceil(auto.target/1000); renderEvery=narrow?1600:5000;
  }
  const pushSample=()=>{
    balHistory.push(balance);
    theoHistory.push(auto._startBal - theoExpected());
    if(balHistory.length>1200){
      const keep=1000, outB=[balHistory[0]], outT=[theoHistory[0]];
      for(let i=1;i<keep-1;i++){
        const idx=Math.round(i*(balHistory.length-1)/(keep-1));
        outB.push(balHistory[idx]); outT.push(theoHistory[idx]);
      }
      outB.push(balHistory[balHistory.length-1]); outT.push(theoHistory[theoHistory.length-1]);
      balHistory=outB; theoHistory=outT;
    }
  };
  while(auto.done<auto.target && !auto.stop){
    const n=Math.min(batch, auto.target-auto.done);
    for(let i=0;i<n;i++){
      if(shoe.length<6){ newShoe(true); }
      const pred=autoPredict(auto.motto);
      const h=playHand();
      if(pred){
        applyBet(h, pred, auto.amt, false, true); // skip per-hand hist；假餘額可為負
      } else {
        applyBet(h, null, 0, true, true);
      }
      auto.done++;
      if(auto.done%sampleEvery===0) pushSample();
    }
    // ensure sample at batch end
    pushSample();
    document.getElementById('autoStatus').textContent=
      '開牌 '+auto.done+'／'+auto.target+'｜實際下注 '+stats.bets+'｜模擬幣';
    updateStatsUI();
    if(auto.done%renderEvery===0 || auto.done>=auto.target){
      renderAll(true); drawChart();
    } else {
      drawChart();
    }
    const elapsed=performance.now()-t0;
    const expected = targetMs * (auto.done/auto.target);
    const wait = window.__BAC_FAST__ ? 0 : Math.max(0, expected - elapsed);
    await new Promise(r=>setTimeout(r, wait || (window.__BAC_FAST__?0:0)));
    if(!window.__BAC_FAST__ && wait===0 && auto.target>1000){
      await new Promise(r=>requestAnimationFrame(()=>r()));
    }
  }
  // final sample
  if(balHistory[balHistory.length-1]!==balance){
    balHistory.push(balance);
    theoHistory.push(auto._startBal - theoExpected());
  }
  suppressPopup=false;
  auto.running=false;
  document.getElementById('btnAuto').textContent='開始';
  renderAll(true); drawChart();
  const elapsed=((performance.now()-t0)/1000).toFixed(2);
  const theo=theoExpected(); // expected loss (positive)
  const theoPnl=-theo;
  document.getElementById('theoLine').textContent=
    '理論平均：約 '+(theoPnl>0?'+':'')+fmt(Math.round(theoPnl))+'（押莊 −1.06%／押閒 −1.24% × 實際下注額）｜耗時 '+elapsed+'s';
  const pnl=stats.pnl;
  const main=document.getElementById('finalMain');
  main.textContent=auto.target+' 手：累計 '+(pnl>0?'+':'')+fmt(pnl);
  main.className='main '+(pnl>0?'win':(pnl<0?'lose':''));
  document.getElementById('finalSub').textContent='實際下注 '+stats.bets+' 手｜總下注額 '+fmt(stats.wagered)+'｜模擬幣';
  document.getElementById('finalTheo').textContent='理論平均：'+(theoPnl>0?'+':'')+fmt(Math.round(theoPnl));
  const actRate=stats.wagered? (pnl/stats.wagered*100) : 0;
  const theoRate=stats.wagered? (theoPnl/stats.wagered*100) : 0;
  const gapPct=stats.wagered? ((pnl - theoPnl)/stats.wagered*100) : 0;
  const fmtPct=(x)=>{ const s=x.toFixed(2); return (x>0?'+':'')+s+'%'; };
  document.getElementById('finalRates').textContent='實際 '+fmtPct(actRate)+'／理論 '+fmtPct(theoRate);
  document.getElementById('finalGap').textContent='與理論差距 '+fmtPct(gapPct);
  document.getElementById('finalOverlay').classList.add('show');
  document.getElementById('autoStatus').textContent=
    '開牌 '+auto.done+'／'+auto.target+'｜實際下注 '+stats.bets+'｜完成 '+elapsed+'s';
  return {elapsed:Number(elapsed), stats:Object.assign({},stats), theo, theoPnl, gapPct, actRate, theoRate, balance};
}
function closeFinal(){ document.getElementById('finalOverlay').classList.remove('show'); }

document.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!auto.running) dealBet(); });

window.__BAC__={
  appendRoad, buildDerivedColumns, detectPatterns, findAllPatterns, placeBeads, columnsRef:()=>columns,
  setColumns:(c)=>{columns=c; historyNonTie=[]; for(const col of c) for(const b of col) historyNonTie.push(b.side);},
  history:()=>historyNonTie, countBeads, fastPave, newShoe, playHand, leadingTies:()=>leadingTies,
  settle, autoPredict, startAuto, stopAuto, resetStats,
  getStats:()=>Object.assign({},stats), getBalance:()=>balance, getAuto:()=>Object.assign({},auto),
  getBalHistory:()=>balHistory.slice(), getTheoHistory:()=>theoHistory.slice(),
  setBalance:(v)=>{balance=v; updateStatsUI();},
  theoExpected
};

updateStatsUI(); renderAll(true); drawChart();
</script>
